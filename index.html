<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BTV+ — Launching Soon</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px 20px;
        background: url("greybrick.png") center / cover no-repeat;
        font-family: Inter, "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        color: #fff;
        text-align: center;
      }

      .logo {
        display: block;
        width: min(280px, 70vw);
        height: auto;
        margin: 0 auto 36px;
      }

      h1 {
        font-size: clamp(1.6rem, 4vw, 2.4rem);
        font-weight: 800;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      p {
        margin-top: 18px;
        font-size: clamp(0.85rem, 2.2vw, 1.05rem);
        font-weight: 600;
        letter-spacing: 0.08em;
        line-height: 1.55;
        text-transform: uppercase;
      }

      a {
        display: inline-block;
        margin-top: 32px;
        padding: 12px 22px;
        border: 1px solid #fff;
        border-radius: 999px;
        background: transparent;
        color: #fff;
        font-size: 0.85rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-decoration: none;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <main>
      <img class="logo" src="BTVplus.svg" alt="BTV+" />
      <h1>Launching Soon</h1>
      <p>The brand new streaming service for Binghamton original works</p>
      <a
        href="https://docs.google.com/forms/d/e/1FAIpQLSf7EkSd0UTYfFEVvFm5bf_62WnE2hh85YqnEiEIuPZxSosf0A/viewform?usp=sharing&ouid=115420483520726985363"
        target="_blank"
        rel="noopener noreferrer"
      >
        Add your film to the platform
      </a>
    </main>
  </body>
</html>
